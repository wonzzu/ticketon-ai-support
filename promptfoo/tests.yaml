    suite: full
    category: policy-composite
  vars:
    question: 줄 통과하고 9분 뒤에 자리 잡으면 좌석 시간도 1분만 남아요?
  assert:
    - type: javascript
      value: |
        const response = JSON.parse(output);
        const policyIds = response.sources.map(source => source.policyId);

        return response.answer.includes("7분")
          && response.answer.includes("1분")
          && policyIds.includes("QUEUE-04")
          && policyIds.includes("SEAT-02");

