spring.application.name=ticketon-ai-support
management.endpoints.web.exposure.include=health,metrics
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.chat.observations.include-error-logging=false
spring.ai.tools.observations.include-content=false
spring.ai.tools.throw-exception-on-error=true
app.generation-evaluation.enabled=false
app.generation-evaluation.dataset=development
app.ticketon.base-url=${TICKETON_BASE_URL:http://localhost:8080}
app.ticketon.connect-timeout=${TICKETON_CONNECT_TIMEOUT:2s}
app.ticketon.read-timeout=${TICKETON_READ_TIMEOUT:5s}
